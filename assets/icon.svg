    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ecf8"/><stop offset=".5" stop-color="#c3cde2"/><stop offset="1" stop-color="#9fb0d6"/>
